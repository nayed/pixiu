<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Token Pet on-page overlay, baby stage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8cc8ff}a:hover{color:#bfe0ff}
@keyframes tp-bob5{0%,49.9%{transform:translateY(0)}50%,100%{transform:translateY(5px)}}
@keyframes tp-blink{0%,92%{opacity:0}93%,100%{opacity:1}}
@keyframes tp-chomp{0%,33%{clip-path:inset(0 0 0 0)}33.1%,66%{clip-path:inset(0 50% 0 0)}66.1%,100%{clip-path:inset(0 100% 0 0)}}
@media (prefers-reduced-motion: reduce){.tp-anim{animation:none!important}}
</style>
</helmet>
<div style="position: relative; width: 1200px; height: 720px; box-sizing: border-box; display: flex; background: {{c.page}}; color: {{c.text}}; font-family: 'VT323', 'Courier New', monospace; font-size: 20px; line-height: 1.1; overflow: hidden">
<div aria-hidden="true" style="width: 220px; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: column; gap: 12px; background: {{c.side}}">
<div style="height: 20px; width: 120px; background: {{c.blockB}}"></div>
<div style="height: 12px; width: 170px; background: {{c.blockA}}; margin-top: 16px"></div>
<div style="height: 12px; width: 140px; background: {{c.blockA}}"></div>
<div style="height: 12px; width: 160px; background: {{c.blockA}}"></div>
<div style="height: 12px; width: 110px; background: {{c.blockA}}"></div>
<div style="height: 12px; width: 150px; background: {{c.blockA}}"></div>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding: 24px 0 32px">
<div style="width: 520px; display: flex; flex-direction: column; gap: 20px; flex-grow: 1">
<p style="margin: 0">Claude page (grey placeholder, not the real layout)</p>
<div aria-hidden="true" style="align-self: flex-end; width: 300px; height: 56px; background: {{c.blockB}}"></div>
<div aria-hidden="true" style="width: 440px; height: 132px; background: {{c.blockA}}"></div>
<div aria-hidden="true" style="align-self: flex-end; width: 220px; height: 40px; background: {{c.blockB}}"></div>
<div aria-hidden="true" style="width: 400px; height: 96px; background: {{c.blockA}}"></div>
<div style="margin-top: auto; box-sizing: border-box; height: 76px; padding: 12px 16px; border: 2px solid {{c.blockB}}; background: {{c.side}}">Message box (placeholder)</div>
</div>
</div>
<div style="position: absolute; right: 36px; bottom: 36px; display: flex; flex-direction: column; align-items: flex-end; gap: 20px">
<sc-if value="{{showStats}}" hint-placeholder-val="{{true}}">
<div style="width: 220px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #1d1b2e; color: #f3f1ff; box-shadow: 0 0 0 4px #f3f1ff, 0 0 0 8px #1d1b2e">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
<h2 style="margin: 0; font-family: 'Pixelify Sans', 'Courier New', monospace; font-size: 20px; font-weight: 700; line-height: 1">Mochi</h2>
<p style="margin: 0; color: #b9b4d9">Age 0</p>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; gap: 8px"><span>Food</span><span style="color: #ffb366">{{foodPct}}%</span></div>
<div aria-hidden="true" style="display: flex; gap: 3px">
<sc-for list="{{food}}" as="f" hint-placeholder-count="10">
<div style="position: relative; width: 16px; height: 16px">
<div style="position: absolute; left: -2px; top: -2px; width: 2px; height: 2px; box-shadow: {{f.s}}"></div>
</div>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; gap: 8px"><span>Growth</span><span style="color: #8cc8ff">41%</span></div>
<div aria-hidden="true" style="display: flex; gap: 3px">
<sc-for list="{{growSegs}}" as="seg" hint-placeholder-count="10">
<div style="flex-grow: 1; height: 8px; background: {{seg.c}}"></div>
</sc-for>
</div>
</div>
<button style="min-height: 44px; padding: 0 12px; background: #2a2744; border: 2px solid #6a63a8; color: #f3f1ff; font-family: 'VT323', 'Courier New', monospace; font-size: 20px; cursor: pointer">Hide on this page</button>
</div>
</sc-if>
<div style="position: relative; width: 128px; height: 96px; background: #bfe8f2; overflow: hidden; box-shadow: 0 0 0 4px #f3f1ff, 0 0 0 8px #1d1b2e">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 20px; background: #7cc96b; border-top: 4px solid #4fa354; box-sizing: border-box"></div>
<div class="tp-anim" style="position: absolute; left: 40px; top: 2px; width: 80px; height: 80px; animation: {{bob}}">
<div role="img" aria-label="Mochi as a baby, in a small window in the corner of the page" style="position: absolute; left: 0; top: 0; width: 80px; height: 80px">
<div style="position: absolute; left: -5px; top: -5px; width: 5px; height: 5px; box-shadow: {{pet}}"></div>
</div>
<sc-if value="{{blinks}}" hint-placeholder-val="{{false}}">
<div class="tp-anim" aria-hidden="true" style="position: absolute; left: -5px; top: -5px; width: 5px; height: 5px; box-shadow: {{blink}}; animation: tp-blink 4s linear infinite"></div>
</sc-if>
</div>
<sc-if value="{{eating}}" hint-placeholder-val="{{false}}">
<div class="tp-anim" aria-hidden="true" style="position: absolute; left: 46px; top: 50px; width: 24px; height: 24px; animation: tp-chomp 1.2s linear infinite">
<div style="position: absolute; left: -3px; top: -3px; width: 3px; height: 3px; box-shadow: {{cookie}}"></div>
</div>
</sc-if>
<sc-if value="{{asleep}}" hint-placeholder-val="{{false}}">
<div aria-hidden="true" style="position: absolute; left: 6px; top: 6px; font-family: 'Pixelify Sans', 'Courier New', monospace; font-size: 18px; font-weight: 700; color: #1d1b2e">z Z</div>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["eating","idle","hungry","napping"],"default":"eating"},"page":{"editor":"enum","options":["dark","light"],"default":"dark"},"showStats":{"editor":"boolean","default":true},"$preview":{"width":1200,"height":720}}'>
class Component extends DCLogic {
shadow(rows, pal, s) {
var out = [];
var sp = s >= 3 ? 0.25 : 0;
for (var y = 0; y < rows.length; y++) {
for (var x = 0; x < rows[y].length; x++) {
var c = pal[rows[y][x]];
if (c) out.push(((x + 1) * s) + 'px ' + ((y + 1) * s) + 'px 0 ' + sp + 'px ' + c);
}
}
return out.join(',');
}
baby(mood) {
var top = [
'................',
'................',
'................',
'................',
'......kkkk......',
'.....kwwwwk.....',
'....kwkwwkwk....',
'...kkykyykykk...',
'..kyyyyyyyyyyk..'
];
var F = {
happy: [
'..kyweyyyyweyk..',
'..kyeeyyyyeeyk..',
'..kpyyykkyyypk..',
'..kyyyyyyyyyok..',
'...kooyyyyook...',
'....kkkkkkkk....',
'................'
],
eating: [
'..kyweyyyyweyk..',
'..kyeeyyyyeeyk..',
'..kpyykkkkyypk..',
'..kyyykrrkyyok..',
'...kooykkyook...',
'....kkkkkkkk....',
'................'
],
hungry: [
'..kyweyyyyweyk..',
'..kyeeyyyyeeyk..',
'..kyybkkkkbyyk..',
'..kyyykrrkyyok..',
'...kooykkyook...',
'....kkkkkkkk....',
'................'
],
stuffed: [
'..kyyyyyyyyyyk..',
'..kyeeyyyyeeyk..',
'..kpyyykkyyypk..',
'.kyyybbbbbbyyyk.',
'..kooybbbbyook..',
'...kkkkkkkkkk...',
'................'
]
};
return top.concat(F[mood] || F.happy);
}
blinkPatch() {
var rows = [];
for (var i = 0; i < 16; i++) rows.push(i === 9 ? '....yy....yy....' : '................');
return rows;
}
cookie() {
return [
'..kkkk..',
'.kcccck.',
'kccdccck',
'kcccccdk',
'kcdcccck',
'kcccdcck',
'.kcccck.',
'..kkkk..'
];
}
renderVals() {
var state = this.props.state ?? 'eating';
var S = {
eating: { mood: 'eating', pct: 62, bob: 'tp-bob5 0.4s linear infinite' },
idle: { mood: 'happy', pct: 62, bob: 'tp-bob5 1s linear infinite' },
hungry: { mood: 'hungry', pct: 8, bob: 'tp-bob5 1s linear infinite' },
napping: { mood: 'stuffed', pct: 100, bob: 'tp-bob5 2.4s linear infinite' }
};
var s = S[state] || S.eating;
var dark = (this.props.page ?? 'dark') === 'dark';
var c = dark
? { page: '#1f1f1d', side: '#181816', blockA: '#2d2d2a', blockB: '#3a3a36', text: '#b5b5ae' }
: { page: '#f1f1ee', side: '#e4e4e0', blockA: '#e4e4e0', blockB: '#d2d2cc', text: '#55554f' };
var pal = { k: '#1d1b2e', e: '#1d1b2e', y: '#5cc8a0', o: '#3a9e7c', w: '#fff6dc', p: '#ff7a90', b: '#e3f7ec', r: '#8a2b3a' };
if (state === 'hungry') pal.b = '#4aa8ff';
var cookiePal = { k: '#7a3610', c: '#ff9a3c', d: '#b3541e' };
var full = this.shadow(this.cookie(), cookiePal, 2);
var empty = this.shadow(this.cookie(), { k: '#4a4578', c: '#26233d', d: '#26233d' }, 2);
var n = Math.round(s.pct / 10);
var food = [];
for (var i = 0; i < 10; i++) food.push({ s: i < n ? full : empty });
var grow = [];
for (var j = 0; j < 10; j++) grow.push({ c: j < 4 ? '#4aa8ff' : '#3a3660' });
return {
c: c,
pet: this.shadow(this.baby(s.mood), pal, 5),
blink: this.shadow(this.blinkPatch(), pal, 5),
cookie: this.shadow(this.cookie(), cookiePal, 3),
blinks: state !== 'napping',
eating: state === 'eating',
asleep: state === 'napping',
showStats: this.props.showStats ?? true,
bob: s.bob,
foodPct: s.pct,
food: food,
growSegs: grow
};
}
}
</script>
</body>
</html>
