<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Token Pet on-page overlay, hatching moment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8cc8ff}a:hover{color:#bfe0ff}
input::placeholder{color:#b9b4d9;opacity:1}
@keyframes tp-pop5{0%{transform:translateY(0)}70%{transform:translateY(-10px)}80%{transform:translateY(-5px)}90%,100%{transform:translateY(0)}}
@keyframes tp-blink{0%,92%{opacity:0}93%,100%{opacity:1}}
@keyframes tp-twinkle{0%,49.9%{opacity:1}50%,100%{opacity:0.15}}
@media (prefers-reduced-motion: reduce){.tp-anim{animation:none!important}}
</style>
</helmet>
<div style="position: relative; width: 1200px; height: 720px; box-sizing: border-box; display: flex; background: {{c.page}}; color: {{c.text}}; font-family: 'VT323', 'Courier New', monospace; font-size: 20px; line-height: 1.1; overflow: hidden">
<div aria-hidden="true" style="width: 220px; box-sizing: border-box; padding: 24px 16px; display: flex; flex-direction: column; gap: 12px; background: {{c.side}}">
<div style="height: 20px; width: 120px; background: {{c.blockB}}"></div>
<div style="height: 12px; width: 170px; background: {{c.blockA}}; margin-top: 16px"></div>
<div style="height: 12px; width: 140px; background: {{c.blockA}}"></div>
<div style="height: 12px; width: 160px; background: {{c.blockA}}"></div>
<div style="height: 12px; width: 110px; background: {{c.blockA}}"></div>
<div style="height: 12px; width: 150px; background: {{c.blockA}}"></div>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; padding: 24px 0 32px">
<div style="width: 520px; display: flex; flex-direction: column; gap: 20px; flex-grow: 1">
<p style="margin: 0">Claude page (grey placeholder, not the real layout)</p>
<div aria-hidden="true" style="align-self: flex-end; width: 300px; height: 56px; background: {{c.blockB}}"></div>
<div aria-hidden="true" style="width: 440px; height: 132px; background: {{c.blockA}}"></div>
<div aria-hidden="true" style="align-self: flex-end; width: 220px; height: 40px; background: {{c.blockB}}"></div>
<div aria-hidden="true" style="width: 400px; height: 96px; background: {{c.blockA}}"></div>
<div style="margin-top: auto; box-sizing: border-box; height: 76px; padding: 12px 16px; border: 2px solid {{c.blockB}}; background: {{c.side}}">Message box (placeholder)</div>
</div>
</div>
<div style="position: absolute; right: 36px; bottom: 36px; display: flex; flex-direction: column; align-items: flex-end; gap: 20px">
<sc-if value="{{showCard}}" hint-placeholder-val="{{true}}">
<div style="width: 220px; box-sizing: border-box; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: #1d1b2e; color: #f3f1ff; box-shadow: 0 0 0 4px #f3f1ff, 0 0 0 8px #1d1b2e">
<h2 style="margin: 0; font-family: 'Pixelify Sans', 'Courier New', monospace; font-size: 20px; font-weight: 700; line-height: 1">It hatched!</h2>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="tp-name-overlay">Name your pet</label>
<input id="tp-name-overlay" type="text" placeholder="Type a name" style="height: 44px; box-sizing: border-box; padding: 0 12px; background: #2a2744; border: 2px solid #6a63a8; color: #f3f1ff; font-family: 'VT323', 'Courier New', monospace; font-size: 22px">
</div>
<button style="min-height: 44px; padding: 0 12px; background: #ff9a3c; border: 0; color: #1d1b2e; font-family: 'Pixelify Sans', 'Courier New', monospace; font-size: 18px; font-weight: 700; cursor: pointer">Say hello</button>
</div>
</sc-if>
<div style="position: relative; width: 128px; height: 96px; background: #bfe8f2; overflow: hidden; box-shadow: 0 0 0 4px #f3f1ff, 0 0 0 8px #1d1b2e">
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 20px; background: #7cc96b; border-top: 4px solid #4fa354; box-sizing: border-box"></div>
<div class="tp-anim" aria-hidden="true" style="position: absolute; left: 8px; top: 12px; width: 10px; height: 10px; animation: tp-twinkle 0.9s linear infinite">
<div style="position: absolute; left: -2px; top: -2px; width: 2px; height: 2px; box-shadow: {{sparkW}}"></div>
</div>
<div class="tp-anim" aria-hidden="true" style="position: absolute; left: 108px; top: 8px; width: 10px; height: 10px; animation: tp-twinkle 1.3s linear infinite">
<div style="position: absolute; left: -2px; top: -2px; width: 2px; height: 2px; box-shadow: {{sparkY}}"></div>
</div>
<div class="tp-anim" aria-hidden="true" style="position: absolute; left: 110px; top: 44px; width: 10px; height: 10px; animation: tp-twinkle 0.7s linear infinite">
<div style="position: absolute; left: -2px; top: -2px; width: 2px; height: 2px; box-shadow: {{sparkW}}"></div>
</div>
<div class="tp-anim" style="position: absolute; left: 24px; top: 6px; width: 80px; height: 80px; animation: {{pop}}">
<div role="img" aria-label="A baby pet hatching from its egg, in a small window in the corner of the page" style="position: absolute; left: 0; top: 0; width: 80px; height: 80px">
<div style="position: absolute; left: -5px; top: -5px; width: 5px; height: 5px; box-shadow: {{pet}}"></div>
</div>
<sc-if value="{{hatched}}" hint-placeholder-val="{{true}}">
<div class="tp-anim" aria-hidden="true" style="position: absolute; left: -5px; top: -5px; width: 5px; height: 5px; box-shadow: {{blink}}; animation: tp-blink 4s linear infinite"></div>
</sc-if>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"frame":{"editor":"enum","options":["peeking","hatched"],"default":"hatched"},"page":{"editor":"enum","options":["dark","light"],"default":"dark"},"showCard":{"editor":"boolean","default":true},"$preview":{"width":1200,"height":720}}'>
class Component extends DCLogic {
shadow(rows, pal, s) {
var out = [];
var sp = s >= 3 ? 0.25 : 0;
for (var y = 0; y < rows.length; y++) {
for (var x = 0; x < rows[y].length; x++) {
var c = pal[rows[y][x]];
if (c) out.push(((x + 1) * s) + 'px ' + ((y + 1) * s) + 'px 0 ' + sp + 'px ' + c);
}
}
return out.join(',');
}
hatch(frame) {
var F = {
peeking: [
'......kkkk......',
'....kkwwwwkk....',
'...kwwwwwwwwk...',
'..kwwsswwwwwwk..',
'.kwwwsswwwwwwwk.',
'.kwkwwkwwkwwkwk.',
'..kkkkkkkkkkkk..',
'..kkwkkkkkkwkk..',
'.kwkwwkwwkwwkwk.',
'.kwwwwwwwwsswwk.',
'.kwwsswwwwwwwdk.',
'.kwwsswwwwwwddk.',
'..kwwwwwwwwddk..',
'..kdwwwwwwdddk..',
'...kkddddddkk...',
'.....kkkkkk.....'
],
hatched: [
'................',
'................',
'......kkkk......',
'.....kwwwwk.....',
'....kwkwwkwk....',
'...kkykyykykk...',
'..kyyyyyyyyyyk..',
'..kyheyyyyheyk..',
'..kyeeyyyyeeyk..',
'.kkpyyykkyyypkk.',
'.kwkyykwwkyykwk.',
'.kwwkkwwwwkkwdk.',
'..kwwwwwwwwddk..',
'..kdwwwwwwdddk..',
'...kkddddddkk...',
'.....kkkkkk.....'
]
};
return F[frame] || F.hatched;
}
blinkPatch() {
var rows = [];
for (var i = 0; i < 16; i++) rows.push(i === 7 ? '....yy....yy....' : '................');
return rows;
}
spark() {
return ['..x..', '..x..', 'xxxxx', '..x..', '..x..'];
}
renderVals() {
var frame = this.props.frame ?? 'hatched';
var hatched = frame !== 'peeking';
var dark = (this.props.page ?? 'dark') === 'dark';
var c = dark
? { page: '#1f1f1d', side: '#181816', blockA: '#2d2d2a', blockB: '#3a3a36', text: '#b5b5ae' }
: { page: '#f1f1ee', side: '#e4e4e0', blockA: '#e4e4e0', blockB: '#d2d2cc', text: '#55554f' };
var pal = { k: '#1d1b2e', e: '#1d1b2e', y: '#5cc8a0', w: '#fff6dc', h: '#ffffff', s: '#5cc8a0', d: '#e6d3a3', p: '#ff7a90' };
return {
c: c,
hatched: hatched,
showCard: (this.props.showCard ?? true) && hatched,
pet: this.shadow(this.hatch(frame), pal, 5),
blink: this.shadow(this.blinkPatch(), pal, 5),
pop: hatched ? 'tp-pop5 1.6s step-end infinite' : 'tp-pop5 0.6s step-end infinite',
sparkW: this.shadow(this.spark(), { x: '#ffffff' }, 2),
sparkY: this.shadow(this.spark(), { x: '#ffd23f' }, 2)
};
}
}
</script>
</body>
</html>
