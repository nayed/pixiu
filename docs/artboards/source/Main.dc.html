<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Token Pet popup, egg stage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8cc8ff}a:hover{color:#bfe0ff}
@keyframes tp-wob8{0%{transform:translateX(0)}60%{transform:translateX(-8px)}70%{transform:translateX(8px)}80%{transform:translateX(-8px)}90%,100%{transform:translateX(0)}}
@media (prefers-reduced-motion: reduce){.tp-anim{animation:none!important}}
</style>
</helmet>
<div style="width: 360px; height: 520px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: #1d1b2e; color: #f3f1ff; font-family: 'VT323', 'Courier New', monospace; font-size: 20px; line-height: 1.1">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; align-items: baseline; gap: 12px">
<h1 style="margin: 0; font-family: 'Pixelify Sans', 'Courier New', monospace; font-size: 28px; font-weight: 700; line-height: 1">Egg</h1>
<p style="margin: 0; color: #b9b4d9">Not hatched yet</p>
</div>
<button aria-label="Settings" style="width: 44px; height: 44px; padding: 0; display: flex; align-items: center; justify-content: center; background: #2a2744; border: 2px solid #6a63a8; color: #f3f1ff; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M3 6h9M16 6h3M3 16h3M10 16h9"></path><rect x="12" y="4" width="4" height="4"></rect><rect x="6" y="14" width="4" height="4"></rect></svg>
</button>
</div>
<div style="position: relative; box-sizing: border-box; height: 220px; background: #bfe8f2; border: 4px solid #f3f1ff; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 20px; top: 20px; width: 48px; height: 8px; background: #ffffff"></div>
<div aria-hidden="true" style="position: absolute; left: 28px; top: 12px; width: 24px; height: 8px; background: #ffffff"></div>
<div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 36px; background: #7cc96b; border-top: 4px solid #4fa354; box-sizing: border-box"></div>
<div class="tp-anim" style="position: absolute; left: 76px; top: 56px; width: 128px; height: 128px; animation: {{wobble}}">
<div role="img" aria-label="A speckled pixel-art egg" style="position: absolute; left: 0; top: 0; width: 128px; height: 128px">
<div style="position: absolute; left: -8px; top: -8px; width: 8px; height: 8px; box-shadow: {{egg}}"></div>
</div>
</div>
<div role="img" aria-label="Egg warmth thermometer" style="position: absolute; left: 252px; top: 22px; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="font-family: 'Pixelify Sans', 'Courier New', monospace; font-size: 16px; font-weight: 700; color: #1d1b2e">{{pct}}%</span>
<div style="width: 16px; height: 128px; box-sizing: border-box; padding: 2px; display: flex; flex-direction: column-reverse; gap: 2px; background: #1d1b2e">
<sc-for list="{{segs}}" as="seg" hint-placeholder-count="10">
<div style="flex-grow: 1; background: {{seg.c}}"></div>
</sc-for>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<h2 style="margin: 0; font-family: 'Pixelify Sans', 'Courier New', monospace; font-size: 18px; font-weight: 600">Warmth</h2>
<span style="font-family: 'Pixelify Sans', 'Courier New', monospace; font-size: 18px; font-weight: 600; color: #ffb366">{{pct}}%</span>
</div>
<p style="margin: 0; color: #b9b4d9">{{note}}</p>
</div>
<p style="margin: 0">You name your pet when it hatches.</p>
<label style="display: flex; align-items: center; gap: 10px; min-height: 44px; margin-top: auto; border-top: 2px solid #3a3660; cursor: pointer">
<input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #ff9a3c">
<span>Show the egg on the Claude page</span>
</label>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"enum","options":["new","warming","hatching"],"default":"warming"},"$preview":{"width":360,"height":520}}'>
class Component extends DCLogic {
shadow(rows, pal, s) {
var out = [];
var sp = s >= 3 ? 0.25 : 0;
for (var y = 0; y < rows.length; y++) {
for (var x = 0; x < rows[y].length; x++) {
var c = pal[rows[y][x]];
if (c) out.push(((x + 1) * s) + 'px ' + ((y + 1) * s) + 'px 0 ' + sp + 'px ' + c);
}
}
return out.join(',');
}
egg(stage) {
var rows = [
'................',
'......kkkk......',
'....kkwwwwkk....',
'...kwwwwwwwwk...',
'..kwwwwwwwwwwk..',
'..kwwsswwwwwwk..',
'.kwwwsswwwwwwwk.',
'.kwwwwwwwwsswwk.',
'.kwwwwwwwwsswwk.',
'.kwwwwwwwwwwwwk.',
'.kwwsswwwwwwwdk.',
'.kwwsswwwwwwddk.',
'..kwwwwwwwwddk..',
'..kdwwwwwwdddk..',
'...kkddddddkk...',
'.....kkkkkk.....'
];
var pts = [];
if (stage === 'warming') pts = [[5, 7], [6, 8], [7, 7], [8, 8]];
if (stage === 'hatching') { for (var x = 2; x <= 13; x++) pts.push([x, x % 2 ? 7 : 8]); }
var grid = rows.map(function (r) { return r.split(''); });
pts.forEach(function (p) { grid[p[1]][p[0]] = 'k'; });
return grid.map(function (r) { return r.join(''); });
}
renderVals() {
var stage = this.props.stage ?? 'warming';
var S = {
'new': { pct: 0, note: 'Send a message to start warming the egg.', wobble: 'none' },
warming: { pct: 40, note: 'Using Claude warms the egg. It hatches at 100%.', wobble: 'tp-wob8 2.4s step-end infinite' },
hatching: { pct: 90, note: 'Almost there. A few more messages.', wobble: 'tp-wob8 0.8s step-end infinite' }
};
var s = S[stage] || S.warming;
var pal = { k: '#1d1b2e', w: '#fff6dc', s: '#5cc8a0', d: '#e6d3a3' };
var n = Math.round(s.pct / 10);
var segs = [];
for (var i = 0; i < 10; i++) segs.push({ c: i < n ? '#e8590c' : '#ffffff' });
return {
egg: this.shadow(this.egg(stage), pal, 8),
wobble: s.wobble,
pct: s.pct,
note: s.note,
segs: segs
};
}
}
</script>
</body>
</html>
