<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Token Pet toolbar icon, hatching moment</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8cc8ff}a:hover{color:#bfe0ff}
</style>
</helmet>
<div style="width: 960px; height: 520px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 24px; background: #1d1b2e; color: #f3f1ff; font-family: 'VT323', 'Courier New', monospace; font-size: 20px; line-height: 1.1">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Pixelify Sans', 'Courier New', monospace; font-size: 28px; font-weight: 700; line-height: 1">Toolbar icon: hatching</h1>
<p style="margin: 0; color: #b9b4d9">The icon plays these three frames once, then keeps a ! badge until the pet has a name.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 20px 0; background: #bfe8f2">
<div style="display: flex; justify-content: center">
<div role="img" aria-label="Egg icon cracked all the way across" style="position: relative; width: 96px; height: 96px">
<div style="position: absolute; left: -6px; top: -6px; width: 6px; height: 6px; box-shadow: {{crack6}}"></div>
</div>
</div>
<div style="display: flex; justify-content: center">
<div role="img" aria-label="Egg icon split open, with two eyes peeking out of the gap" style="position: relative; width: 96px; height: 96px">
<div style="position: absolute; left: -6px; top: -6px; width: 6px; height: 6px; box-shadow: {{peek6}}"></div>
</div>
</div>
<div style="display: flex; justify-content: center">
<div role="img" aria-label="Baby pet sitting in the bottom half of the shell, wearing the top half as a hat" style="position: relative; width: 96px; height: 96px">
<div style="position: absolute; left: -6px; top: -6px; width: 6px; height: 6px; box-shadow: {{hatched6}}"></div>
</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 10px; text-align: center">
<h2 style="margin: 0; font-family: 'Pixelify Sans', 'Courier New', monospace; font-size: 20px; font-weight: 600">1. Cracked</h2>
<p style="margin: 0; color: #b9b4d9">Warmth reaches 100%</p>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 10px; text-align: center">
<h2 style="margin: 0; font-family: 'Pixelify Sans', 'Courier New', monospace; font-size: 20px; font-weight: 600">2. Peeking</h2>
<p style="margin: 0; color: #b9b4d9">The shell splits open</p>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 10px; text-align: center">
<h2 style="margin: 0; font-family: 'Pixelify Sans', 'Courier New', monospace; font-size: 20px; font-weight: 600">3. Hatched</h2>
<p style="margin: 0; color: #b9b4d9">Waiting for a name</p>
<p style="margin: 0; color: #ffb366">Badge: !</p>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: auto">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 48px; box-sizing: border-box; padding: 0 16px; background: #e9ebf0; color: #4b4f59">
<span>Light toolbar, actual size</span>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 16px">
<div style="position: relative; width: 16px; height: 16px"><div style="position: absolute; left: -1px; top: -1px; width: 1px; height: 1px; box-shadow: {{crack1}}"></div></div>
<div style="position: relative; width: 16px; height: 16px"><div style="position: absolute; left: -1px; top: -1px; width: 1px; height: 1px; box-shadow: {{peek1}}"></div></div>
<div style="position: relative; width: 16px; height: 16px">
<div style="position: absolute; left: -1px; top: -1px; width: 1px; height: 1px; box-shadow: {{hatched1}}"></div>
<span style="position: absolute; left: 9px; top: 8px; padding: 0 3px; background: #1d1b2e; color: #ffffff; font-family: 'Pixelify Sans', 'Courier New', monospace; font-size: 9px; line-height: 10px">!</span>
</div>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 48px; box-sizing: border-box; padding: 0 16px; background: #2b2d33; color: #c9ccd4">
<span>Dark toolbar, actual size</span>
<div aria-hidden="true" style="display: flex; align-items: center; gap: 16px">
<div style="position: relative; width: 16px; height: 16px"><div style="position: absolute; left: -1px; top: -1px; width: 1px; height: 1px; box-shadow: {{crack1}}"></div></div>
<div style="position: relative; width: 16px; height: 16px"><div style="position: absolute; left: -1px; top: -1px; width: 1px; height: 1px; box-shadow: {{peek1}}"></div></div>
<div style="position: relative; width: 16px; height: 16px">
<div style="position: absolute; left: -1px; top: -1px; width: 1px; height: 1px; box-shadow: {{hatched1}}"></div>
<span style="position: absolute; left: 9px; top: 8px; padding: 0 3px; background: #f3f1ff; color: #1d1b2e; font-family: 'Pixelify Sans', 'Courier New', monospace; font-size: 9px; line-height: 10px">!</span>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":520}}'>
class Component extends DCLogic {
shadow(rows, pal, s) {
var out = [];
var sp = s >= 3 ? 0.25 : 0;
for (var y = 0; y < rows.length; y++) {
for (var x = 0; x < rows[y].length; x++) {
var c = pal[rows[y][x]];
if (c) out.push(((x + 1) * s) + 'px ' + ((y + 1) * s) + 'px 0 ' + sp + 'px ' + c);
}
}
return out.join(',');
}
frames() {
return {
crack: [
'................',
'......kkkk......',
'....kkwwwwkk....',
'...kwwwwwwwwk...',
'..kwwwwwwwwwwk..',
'..kwwsswwwwwwk..',
'.kwwwsswwwwwwwk.',
'.kwkwkwkwkwkwkk.',
'.kkwkwkwkwkwkwk.',
'.kwwwwwwwwwwwwk.',
'.kwwsswwwwwwwdk.',
'.kwwsswwwwwwddk.',
'..kwwwwwwwwddk..',
'..kdwwwwwwdddk..',
'...kkddddddkk...',
'.....kkkkkk.....'
],
peek: [
'......kkkk......',
'....kkwwwwkk....',
'...kwwwwwwwwk...',
'..kwwsswwwwwwk..',
'.kwwwsswwwwwwwk.',
'.kwkwwkwwkwwkwk.',
'..kkkkkkkkkkkk..',
'..kkwkkkkkkwkk..',
'.kwkwwkwwkwwkwk.',
'.kwwwwwwwwsswwk.',
'.kwwsswwwwwwwdk.',
'.kwwsswwwwwwddk.',
'..kwwwwwwwwddk..',
'..kdwwwwwwdddk..',
'...kkddddddkk...',
'.....kkkkkk.....'
],
hatched: [
'................',
'................',
'......kkkk......',
'.....kwwwwk.....',
'....kwkwwkwk....',
'...kkykyykykk...',
'..kyyyyyyyyyyk..',
'..kyheyyyyheyk..',
'..kyeeyyyyeeyk..',
'.kkpyyykkyyypkk.',
'.kwkyykwwkyykwk.',
'.kwwkkwwwwkkwdk.',
'..kwwwwwwwwddk..',
'..kdwwwwwwdddk..',
'...kkddddddkk...',
'.....kkkkkk.....'
]
};
}
renderVals() {
var pal = { k: '#1d1b2e', e: '#1d1b2e', y: '#5cc8a0', w: '#fff6dc', h: '#ffffff', s: '#5cc8a0', d: '#e6d3a3', p: '#ff7a90' };
var f = this.frames();
return {
crack6: this.shadow(f.crack, pal, 6),
crack1: this.shadow(f.crack, pal, 1),
peek6: this.shadow(f.peek, pal, 6),
peek1: this.shadow(f.peek, pal, 1),
hatched6: this.shadow(f.hatched, pal, 6),
hatched1: this.shadow(f.hatched, pal, 1)
};
}
}
</script>
</body>
</html>
